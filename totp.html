<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>totp</title>
    <style>
      body {
        max-width: 70rem;
        margin: 1rem;
        font: 14px/1.4 Arial, sans-serif;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 22rem) minmax(0, 1fr);
        align-items: start;
        gap: 1.5rem;
      }

      form, main {
        display: grid;
        gap: 0.5rem;
      }

      form {
        grid-template-columns: minmax(0, 1fr);
      }

      main {
        grid-template-columns: minmax(0, 1fr);
        align-content: start;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
      }

      article {
        position: relative;
        display: grid;
        grid-template-columns: auto 1rem 1fr;
        grid-template-rows: auto auto;
        align-items: center;
        column-gap: 0.5rem;
        row-gap: 0.25rem;
        padding: 0.5rem;
        border: 1px solid #bbb;
        border-radius: 0.375rem;
      }

      input, button {
        padding: 0.25rem 0.4rem;
        font: inherit;
      }

      button {
        width: fit-content;
      }

      article button {
        border: 0;
        background: transparent;
        color: #444;
        cursor: pointer;
      }

      .remove {
        position: absolute;
        top: 0.2rem;
        right: 0.35rem;
        width: 1.5rem;
        height: 1.5rem;
        padding: 0;
        font-size: 0.9rem;
      }

      input::placeholder {
        color: #888;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.5rem;
      }

      .actions button {
        box-sizing: border-box;
        width: 100%;
      }

      form input:not([type="file"]) {
        box-sizing: border-box;
        min-width: 0;
        width: 100%;
      }

      @property --progress {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 100%;
      }

      @keyframes drain {
        from { --progress: 100%; }
        to { --progress: 0%; }
      }

      .timer {
        grid-column: 2;
        grid-row: 2;
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        background: conic-gradient(#555 var(--progress), #ddd 0);
        animation: drain 30s linear infinite;
      }

      strong {
        display: flex;
        grid-column: 1 / -1;
        grid-row: 1;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
        padding-right: 1.5rem;
      }

      strong img {
        width: 1rem;
        height: 1rem;
      }

      strong span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      code {
        grid-column: 1;
        grid-row: 2;
        font-size: 1.3rem;
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 40rem) {
        .layout {
          grid-template-columns: 1fr;
        }

        main {
          max-height: 50vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <section>
        <form id="add-form">
          <input name="name" placeholder="Name" aria-label="Name" required autocomplete="off">
          <input name="secret" placeholder="Base32 Secret" aria-label="Base32 Secret" required autocomplete="off" spellcheck="false">
          <div class="actions">
            <button>Add</button>
            <button id="import-button" type="button">Import</button>
            <button id="export-button" type="button">Export</button>
            <input id="import-file" type="file" accept=".json,application/json" hidden>
          </div>
        </form>
        <p id="message" role="status"></p>
      </section>
      <main id="codes"></main>
    </div>
    <script type="module">
      const storageKey = 'totp-secrets';
      const form = document.querySelector('#add-form');
      const message = document.querySelector('#message');
      const list = document.querySelector('#codes');
      const importFile = document.querySelector('#import-file');
      const exportButton = document.querySelector('#export-button');
      let entries;

      try {
        entries = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (!Array.isArray(entries)) throw new Error();
      } catch {
        entries = [];
      }

      function normalizeSecret(value) {
        return value.toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
      }

      function decodeBase32(value) {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        const clean = normalizeSecret(value);
        if (!clean || /[^A-Z2-7]/.test(clean)) throw new Error('Enter a valid Base32 secret.');

        const bytes = [];
        let buffer = 0;
        let bits = 0;
        for (const character of clean) {
          buffer = (buffer << 5) | alphabet.indexOf(character);
          bits += 5;
          if (bits >= 8) {
            bits -= 8;
            bytes.push((buffer >>> bits) & 255);
            buffer &= (1 << bits) - 1;
          }
        }
        if (!bytes.length || buffer) throw new Error('Enter a valid Base32 secret.');
        return new Uint8Array(bytes);
      }

      async function makeCode(secret, counter) {
        const key = await crypto.subtle.importKey('raw', decodeBase32(secret),
          { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
        const time = new ArrayBuffer(8);
        new DataView(time).setBigUint64(0, BigInt(counter));
        const hash = new Uint8Array(await crypto.subtle.sign('HMAC', key, time));
        const offset = hash[hash.length - 1] & 15;
        const number = ((hash[offset] & 127) << 24) | (hash[offset + 1] << 16) |
          (hash[offset + 2] << 8) | hash[offset + 3];
        return (number % 1000000).toString().padStart(6, '0');
      }

      function save(next) {
        localStorage.setItem(storageKey, JSON.stringify(next.map(({ id, name, secret }) =>
          ({ id, name, secret }))));
      }

      const seen = new Set();
      const unique = entries.filter(entry => {
        if (!entry || typeof entry.name !== 'string' || typeof entry.secret !== 'string')
          return false;
        const secret = normalizeSecret(entry.secret);
        try {
          decodeBase32(secret);
        } catch {
          return false;
        }
        if (seen.has(secret)) return false;
        seen.add(secret);
        entry.secret = secret;
        return true;
      });
      if (unique.length !== entries.length) save(unique);
      entries = unique;

      function render() {
        list.replaceChildren();
        exportButton.disabled = entries.length === 0;
        for (const entry of entries) {
          const card = document.createElement('article');
          const name = document.createElement('strong');
          const code = document.createElement('code');
          const time = document.createElement('span');
          const remove = document.createElement('button');
          const label = document.createElement('span');
          label.textContent = entry.name;
          const domain = entry.name.match(/(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}/i)?.[0];
          if (domain) {
            const icon = document.createElement('img');
            icon.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32`;
            icon.width = 16;
            icon.height = 16;
            icon.alt = '';
            icon.addEventListener('error', () => icon.remove());
            name.append(icon);
          }
          name.append(label);
          code.textContent = '······';
          time.className = 'timer';
          time.setAttribute('role', 'img');
          time.style.animationDelay = `-${Date.now() % 30000 / 1000}s`;
          remove.textContent = 'x';
          remove.className = 'remove';
          remove.type = 'button';
          remove.title = 'Remove';
          remove.setAttribute('aria-label', `Remove ${entry.name}`);
          remove.addEventListener('click', () => {
            const next = entries.filter(item => item.id !== entry.id);
            save(next);
            entries = next;
            render();
          });
          card.append(name, code, time, remove);
          list.append(card);
          entry.code = code;
          entry.time = time;
          entry.counter = -1;
        }
        update();
      }

      async function update() {
        const counter = Math.floor(Date.now() / 30000);
        const remaining = 30 - Math.floor(Date.now() / 1000) % 30;
        for (const entry of entries) {
          entry.time.setAttribute('aria-label', `${remaining} seconds left`);
          if (entry.counter === counter) continue;
          entry.counter = counter;
          try {
            const code = await makeCode(entry.secret, counter);
            if (entries.includes(entry) && entry.counter === counter) entry.code.textContent = code;
          } catch {
            entry.code.textContent = 'Unavailable';
          }
        }
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        try {
          const name = form.elements.name.value.trim();
          const secret = normalizeSecret(form.elements.secret.value.trim());
          if (!name) throw new Error('Enter a name.');
          decodeBase32(secret);
          if (entries.some(entry => entry.secret === secret))
            throw new Error('Secret already added.');
          const next = [...entries, { id: crypto.randomUUID(), name, secret }];
          save(next);
          entries = next;
          form.reset();
          message.textContent = '';
          render();
        } catch (error) {
          message.textContent = error.message;
        }
      });

      document.querySelector('#import-button').addEventListener('click', () => importFile.click());

      importFile.addEventListener('change', async () => {
        if (!importFile.files.length) return;
        try {
          const data = JSON.parse(await importFile.files[0].text());
          if (data.version !== 1 || !Array.isArray(data.entries)) throw new Error();
          const seen = new Set(entries.map(item => item.secret));
          const incoming = [];
          for (const item of data.entries) {
            if (typeof item.name !== 'string' || !item.name.trim() ||
                typeof item.secret !== 'string') throw new Error();
            const secret = normalizeSecret(item.secret);
            decodeBase32(secret);
            if (seen.has(secret)) continue;
            seen.add(secret);
            incoming.push({ id: crypto.randomUUID(), name: item.name.trim(), secret });
          }
          const next = [...entries, ...incoming];
          save(next);
          entries = next;
          render();
          message.textContent = `Imported ${incoming.length} secrets.`;
        } catch {
          message.textContent = 'Could not import that JSON file.';
        }
        importFile.value = '';
      });

      exportButton.addEventListener('click', () => {
        if (!entries.length) return;
        const data = { version: 1, entries: entries.map(({ name, secret }) =>
          ({ name, secret })) };
        const file = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'totp-secrets.json';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      render();
      setInterval(update, 1000);
    </script>
  </body>
</html>
