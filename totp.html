<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>totp</title>
    <style>
      body {
        max-width: 48rem;
        margin: 1rem;
        font: 14px/1.4 Arial, sans-serif;
      }

      form, main {
        display: grid;
        gap: 0.5rem;
      }

      form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: end;
        max-width: 36rem;
      }

      main {
        grid-template-columns: minmax(0, 1fr);
        max-width: 36rem;
        margin-top: 1rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
      }

      article {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto auto;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem;
        border: 1px solid #bbb;
      }

      input, button {
        padding: 0.25rem 0.4rem;
        font: inherit;
      }

      button {
        width: fit-content;
      }

      .actions {
        display: flex;
        grid-column: 1 / -1;
        gap: 0.5rem;
      }

      form input:not([type="file"]) {
        box-sizing: border-box;
        min-width: 0;
        width: 100%;
      }

      strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      code {
        font-size: 1.3rem;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <form id="add-form">
      <label>Name <input name="name" required autocomplete="off"></label>
      <label>Base32 secret <input name="secret" required autocomplete="off" spellcheck="false"></label>
      <div class="actions">
        <button>Add</button>
        <button id="import-button" type="button">Import</button>
        <button id="export-button" type="button">Export</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </form>
    <p id="message" role="status"></p>
    <main id="codes"></main>
    <script type="module">
      const storageKey = 'totp-secrets';
      const form = document.querySelector('#add-form');
      const message = document.querySelector('#message');
      const list = document.querySelector('#codes');
      const importFile = document.querySelector('#import-file');
      const exportButton = document.querySelector('#export-button');
      let entries;

      try {
        entries = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (!Array.isArray(entries)) throw new Error();
      } catch {
        entries = [];
      }

      function decodeBase32(value) {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        const clean = value.toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
        if (!clean || /[^A-Z2-7]/.test(clean)) throw new Error('Enter a valid Base32 secret.');

        const bytes = [];
        let buffer = 0;
        let bits = 0;
        for (const character of clean) {
          buffer = (buffer << 5) | alphabet.indexOf(character);
          bits += 5;
          if (bits >= 8) {
            bits -= 8;
            bytes.push((buffer >>> bits) & 255);
            buffer &= (1 << bits) - 1;
          }
        }
        if (!bytes.length || buffer) throw new Error('Enter a valid Base32 secret.');
        return new Uint8Array(bytes);
      }

      async function makeCode(secret, counter) {
        const key = await crypto.subtle.importKey('raw', decodeBase32(secret),
          { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
        const time = new ArrayBuffer(8);
        new DataView(time).setBigUint64(0, BigInt(counter));
        const hash = new Uint8Array(await crypto.subtle.sign('HMAC', key, time));
        const offset = hash[hash.length - 1] & 15;
        const number = ((hash[offset] & 127) << 24) | (hash[offset + 1] << 16) |
          (hash[offset + 2] << 8) | hash[offset + 3];
        return (number % 1000000).toString().padStart(6, '0');
      }

      function save(next) {
        localStorage.setItem(storageKey, JSON.stringify(next.map(({ id, name, secret }) =>
          ({ id, name, secret }))));
      }

      function render() {
        list.replaceChildren();
        exportButton.disabled = entries.length === 0;
        for (const entry of entries) {
          const card = document.createElement('article');
          const name = document.createElement('strong');
          const code = document.createElement('code');
          const time = document.createElement('span');
          const copy = document.createElement('button');
          const remove = document.createElement('button');
          name.textContent = entry.name;
          code.textContent = '······';
          copy.textContent = '⧉';
          copy.type = 'button';
          copy.title = 'Copy code';
          copy.setAttribute('aria-label', `Copy code for ${entry.name}`);
          copy.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(code.textContent);
            } catch {
              message.textContent = 'Could not copy code.';
            }
          });
          remove.textContent = '×';
          remove.type = 'button';
          remove.title = 'Remove';
          remove.setAttribute('aria-label', `Remove ${entry.name}`);
          remove.addEventListener('click', () => {
            const next = entries.filter(item => item.id !== entry.id);
            save(next);
            entries = next;
            render();
          });
          card.append(name, code, time, copy, remove);
          list.append(card);
          entry.code = code;
          entry.time = time;
          entry.counter = -1;
        }
        update();
      }

      async function update() {
        const counter = Math.floor(Date.now() / 30000);
        const remaining = 30 - Math.floor(Date.now() / 1000) % 30;
        for (const entry of entries) {
          entry.time.textContent = `${remaining}s`;
          if (entry.counter === counter) continue;
          entry.counter = counter;
          try {
            const code = await makeCode(entry.secret, counter);
            if (entries.includes(entry) && entry.counter === counter) entry.code.textContent = code;
          } catch {
            entry.code.textContent = 'Unavailable';
          }
        }
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        try {
          const name = form.elements.name.value.trim();
          const secret = form.elements.secret.value.trim().toUpperCase().replace(/[\s-]/g, '');
          if (!name) throw new Error('Enter a name.');
          decodeBase32(secret);
          const next = [...entries, { id: crypto.randomUUID(), name, secret }];
          save(next);
          entries = next;
          form.reset();
          message.textContent = '';
          render();
        } catch (error) {
          message.textContent = error.message;
        }
      });

      document.querySelector('#import-button').addEventListener('click', () => importFile.click());

      importFile.addEventListener('change', async () => {
        if (!importFile.files.length) return;
        try {
          const data = JSON.parse(await importFile.files[0].text());
          if (data.version !== 1 || !Array.isArray(data.entries)) throw new Error();
          const seen = new Set(entries.map(item => item.secret.toUpperCase()
            .replace(/[\s-]/g, '').replace(/=+$/, '')));
          const incoming = [];
          for (const item of data.entries) {
            if (typeof item.name !== 'string' || !item.name.trim() ||
                typeof item.secret !== 'string') throw new Error();
            const secret = item.secret.toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
            decodeBase32(secret);
            if (seen.has(secret)) continue;
            seen.add(secret);
            incoming.push({ id: crypto.randomUUID(), name: item.name.trim(), secret });
          }
          const next = [...entries, ...incoming];
          save(next);
          entries = next;
          render();
          message.textContent = `Imported ${incoming.length} secrets.`;
        } catch {
          message.textContent = 'Could not import that JSON file.';
        }
        importFile.value = '';
      });

      exportButton.addEventListener('click', () => {
        if (!entries.length) return;
        const data = { version: 1, entries: entries.map(({ name, secret }) =>
          ({ name, secret })) };
        const file = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'totp-secrets.json';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      render();
      setInterval(update, 1000);
    </script>
  </body>
</html>
