<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>totp</title>
    <style>
      body {
        max-width: 64rem;
        margin: 1.5rem;
        font: 16px/1.5 system-ui, sans-serif;
      }

      form, main {
        display: grid;
        gap: 0.75rem;
      }

      form {
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        align-items: end;
        max-width: 48rem;
      }

      main {
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        margin-top: 2rem;
      }

      label, article {
        display: grid;
        gap: 0.25rem;
      }

      article {
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
      }

      input, button {
        padding: 0.5rem;
        font: inherit;
      }

      code {
        font-size: 2rem;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <form id="add-form">
      <label>Name <input name="name" required autocomplete="off"></label>
      <label>Base32 secret <input name="secret" required autocomplete="off" spellcheck="false"></label>
      <button>Add</button>
    </form>
    <p id="message" role="status"></p>
    <main id="codes"></main>
    <script type="module">
      const storageKey = 'totp-secrets';
      const form = document.querySelector('#add-form');
      const message = document.querySelector('#message');
      const list = document.querySelector('#codes');
      let entries;

      try {
        entries = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (!Array.isArray(entries)) throw new Error();
      } catch {
        entries = [];
      }

      function decodeBase32(value) {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        const clean = value.toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
        if (!clean || /[^A-Z2-7]/.test(clean)) throw new Error('Enter a valid Base32 secret.');

        const bytes = [];
        let buffer = 0;
        let bits = 0;
        for (const character of clean) {
          buffer = (buffer << 5) | alphabet.indexOf(character);
          bits += 5;
          if (bits >= 8) {
            bits -= 8;
            bytes.push((buffer >>> bits) & 255);
            buffer &= (1 << bits) - 1;
          }
        }
        if (!bytes.length || buffer) throw new Error('Enter a valid Base32 secret.');
        return new Uint8Array(bytes);
      }

      async function makeCode(secret, counter) {
        const key = await crypto.subtle.importKey('raw', decodeBase32(secret),
          { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
        const time = new ArrayBuffer(8);
        new DataView(time).setBigUint64(0, BigInt(counter));
        const hash = new Uint8Array(await crypto.subtle.sign('HMAC', key, time));
        const offset = hash[hash.length - 1] & 15;
        const number = ((hash[offset] & 127) << 24) | (hash[offset + 1] << 16) |
          (hash[offset + 2] << 8) | hash[offset + 3];
        return (number % 1000000).toString().padStart(6, '0');
      }

      function render() {
        list.replaceChildren();
        for (const entry of entries) {
          const card = document.createElement('article');
          const name = document.createElement('strong');
          const code = document.createElement('code');
          const time = document.createElement('span');
          const remove = document.createElement('button');
          name.textContent = entry.name;
          code.textContent = '······';
          remove.textContent = 'Remove';
          remove.type = 'button';
          remove.addEventListener('click', () => {
            entries = entries.filter(item => item.id !== entry.id);
            localStorage.setItem(storageKey, JSON.stringify(entries));
            render();
          });
          card.append(name, code, time, remove);
          list.append(card);
          entry.code = code;
          entry.time = time;
          entry.counter = -1;
        }
        update();
      }

      async function update() {
        const counter = Math.floor(Date.now() / 30000);
        const remaining = 30 - Math.floor(Date.now() / 1000) % 30;
        for (const entry of entries) {
          entry.time.textContent = `${remaining}s remaining`;
          if (entry.counter === counter) continue;
          entry.counter = counter;
          try {
            const code = await makeCode(entry.secret, counter);
            if (entries.includes(entry) && entry.counter === counter) entry.code.textContent = code;
          } catch {
            entry.code.textContent = 'Unavailable';
          }
        }
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        try {
          const name = form.elements.name.value.trim();
          const secret = form.elements.secret.value.trim().toUpperCase().replace(/[\s-]/g, '');
          decodeBase32(secret);
          entries.push({ id: crypto.randomUUID(), name, secret });
          localStorage.setItem(storageKey, JSON.stringify(entries));
          form.reset();
          message.textContent = '';
          render();
        } catch (error) {
          message.textContent = error.message;
        }
      });

      render();
      setInterval(update, 1000);
    </script>
  </body>
</html>
