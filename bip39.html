<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BIP39</title>
  </head>
  <body>
    <script type="module">
      try {
        const response = await fetch('/bip39-wordlist');
        if (!response.ok) throw new Error();

        const words = (await response.text()).trim().split(/\s+/);
        if (words.length !== 2048) throw new Error();

        const entropy = crypto.getRandomValues(new Uint8Array(32));
        const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', entropy));
        const bits = [...entropy, hash[0]]
          .map(byte => byte.toString(2).padStart(8, '0'))
          .join('');

        document.body.textContent = bits.match(/.{11}/g)
          .map(chunk => words[parseInt(chunk, 2)])
          .join(' ');
      } catch {
        document.body.textContent = 'Unable to generate words. Please reload.';
      }
    </script>
  </body>
</html>
