<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BIP39 mnemonic generator | Alex Rother</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Generate a 24-word BIP39 mnemonic locally in the browser using Web Crypto and the English BIP39 word list.">
    <link rel="canonical" href="https://minecat.net/bip39">
    <style>
      body {
        margin: 1.5rem;
        font: clamp(12px, 3vw, 16px)/1.5 system-ui, sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
        max-width: 32rem;
      }
    </style>
  </head>
  <body>
    <script type="module">
      try {
        const response = await fetch('/bip39-wordlist');
        if (!response.ok) throw new Error();

        const words = (await response.text()).trim().split(/\s+/);
        if (words.length !== 2048) throw new Error();

        const entropy = crypto.getRandomValues(new Uint8Array(32));
        const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', entropy));
        const bits = [...entropy, hash[0]]
          .map(byte => byte.toString(2).padStart(8, '0'))
          .join('');

        const mnemonic = bits.match(/.{11}/g)
          .map(chunk => words[parseInt(chunk, 2)]);
        const grid = document.createElement('main');

        mnemonic.forEach((word, index) => {
          if (index) grid.append(' ');
          const cell = document.createElement('span');
          cell.textContent = word;
          grid.append(cell);
        });

        document.body.replaceChildren(grid);
        document.addEventListener('copy', event => {
          const text = window.getSelection().toString().trim().replace(/\s+/g, ' ');
          if (!text) return;
          event.clipboardData.setData('text/plain', text);
          event.preventDefault();
        });
      } catch {
        document.body.replaceChildren();
      }
    </script>
  </body>
</html>
