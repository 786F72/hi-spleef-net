<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hi, I'm Alex!</title>
    <style>
      body {
        margin: 1rem;
        font: clamp(12px, 3vw, 16px)/1.4 Arial, sans-serif;
      }

      p {
        margin-top: 0;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      a img {
        width: 1rem;
        height: 1rem;
      }

      nav {
        display: grid;
        grid-template-columns: repeat(2, max-content);
        gap: 1rem;
      }

      .section-label {
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
      }

      .domains {
        display: grid;
        grid-template-columns: repeat(4, max-content);
        gap: 0.75rem 1.5rem;
      }

      @media (max-width: 36rem) {
        .domains {
          grid-template-columns: repeat(2, max-content);
        }
      }
    </style>
  </head>
  <body>
    <p>Hi, I'm Alex! Email me at <a href="mailto:alex@minecat.net">alex@minecat.net</a>.</p>
    <nav>
      <a href="/bip39">BIP39</a>
      <a href="/totp">TOTP</a>
    </nav>
    <p class="section-label">Web crawler torture:</p>
    <div class="domains"></div>
    <script>
      const domains = ['minecat.net', 'lattices.net', 'lattices.org', 'ollvm.com', 'pkey.org', 'sad.pet', 'spleef.net'];
      const used = new Set();

      function randomNumber() {
        let number;
        do {
          number = (100000000000n + crypto.getRandomValues(new BigUint64Array(1))[0] % 900000000000n).toString();
        } while (used.has(number));
        used.add(number);
        return number;
      }

      for (const domain of domains) {
        const link = document.createElement('a');
        link.href = `https://${randomNumber()}.${domain}/${randomNumber()}`;
        link.textContent = domain;
        link.dataset.faviconDomain = domain;
        document.querySelector('.domains').append(link);
      }

      for (const link of document.querySelectorAll('a')) {
        const url = new URL(link.href);
        const domain = link.dataset.faviconDomain ||
          (url.protocol === 'mailto:' ? url.pathname.split('@')[1] : url.hostname);
        if (!domain) continue;
        const icon = new Image(16, 16);
        icon.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32`;
        icon.alt = '';
        icon.addEventListener('error', () => icon.remove());
        link.prepend(icon);
      }
    </script>
  </body>
</html>
